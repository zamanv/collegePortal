# Render Blueprint for the college portal.
#
# Deploys the Django app and its managed PostgreSQL together:
#   1. Connect this repository to Render.
#   2. Render reads this file and provisions the Postgres database + web service.
#   3. The web service runs start.sh on every deploy (applies migrations, then
#      serves via gunicorn).
#
# NOTE on media: Render's free/standard instances use ephemeral local disks.
# For durable profile-image uploads set STORAGE_BACKEND=cloudinary (or s3) and
# provide the matching credentials. `local` is fine for development only.

databases:
  - name: collegeportal-db
    databaseName: college_db
    user: collegeportal
    plan: free
    region: oregon

services:
  - type: web
    name: collegeportal
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collegeportal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: STORAGE_BACKEND
        value: "local"
      - key: PYTHON_VERSION
        value: "3.12.10"
